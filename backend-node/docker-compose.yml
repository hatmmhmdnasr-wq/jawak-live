version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jawak
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "4000:4000"
    volumes:
      - .:/app

volumes:
  db-data:
